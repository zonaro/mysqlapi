name: PHP and crypto compatibility
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, openssl
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check assets/setup.js && node --check tests/crypto-vector.mjs
      - name: Unit and interoperability tests
        run: php tests/run.php
      - name: HTTP installation wizard smoke test
        run: bash tests/http-smoke.sh
